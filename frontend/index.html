<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark light" />
  <meta name="description" content="LandricsVilla - local-first AI companion villa. Memory-as-state, multi-model, MCP tools." />
  <title>LandricsVilla - local-first AI companion</title>
  <link rel="stylesheet" href="/frontend/css/theme.css" />
  <link rel="stylesheet" href="/frontend/css/main.css" />
  <link rel="stylesheet" href="/frontend/css/mobile.css" />
</head>
<body class="app-shell">
  <!-- App shell built by app.js (sidebar + view + bottom nav).
       If JS is disabled, fall back to a static landing/redirect. -->
  <div id="app">
    <noscript>
      <div style="max-width:520px;margin:12vh auto;padding:32px;text-align:center;font-family:system-ui,sans-serif;color:#e6edf3;background:#0d1117">
        <h1 style="font-size:32px;margin:0 0 8px">LandricsVilla</h1>
        <p style="color:#8b949e;margin:0 0 16px">local-first AI companion</p>
        <p style="color:#8b949e">This app needs JavaScript enabled to run. Please enable JavaScript and reload.</p>
        <p style="margin-top:24px"><a href="/frontend/pages/home/index.html" style="color:#2dd4bf">Enter the villa</a></p>
      </div>
    </noscript>
  </div>

  <script src="/frontend/js/api.js"></script>
  <script src="/frontend/js/websocket.js"></script>
  <script src="/frontend/js/app.js"></script>
  <script>
    // Boot the SPA. Defaults route to #/home (or login if unauthenticated).
    (function () {
      if (!location.hash) {
        var token = window.LVApi.getToken();
        location.hash = token ? "/home" : "/home";
      }
      window.LVApp.init();
    })();
  </script>
</body>
</html>
